name: Build Cross-Platform (Linux / Windows / macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libobs-dev libsword-dev qt6-base-dev dpkg
      - name: Build & Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scripture-dock-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
      - name: Fetch OBS Studio 31.0.1 SDK & Headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch 31.0.1 https://github.com/obsproject/obs-studio.git obs-src
          New-Item -ItemType Directory -Force -Path obs-inc/obs | Out-Null
          Copy-Item -Path obs-src/libobs/*.h -Destination obs-inc/obs/ -Force
          Copy-Item -Path obs-src/libobs/util -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/graphics -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/callback -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/media-io -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/UI/obs-frontend-api/obs-frontend-api.h -Destination obs-inc/obs/ -Force

          # Minimal obsconfig.h for plugin compilation
          @"
          #pragma once
          #define OBS_VERSION "31.0.1"
          #define HAVE_OBSCONFIG_H 1
          "@ | Set-Content obs-inc/obs/obsconfig.h

          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/31.0.1/OBS-Studio-31.0.1-Windows.zip" -OutFile obs-win.zip
          Expand-Archive -Path obs-win.zip -DestinationPath obs-win -Force
          New-Item -ItemType Directory -Force -Path obs-lib | Out-Null

          foreach ($dll in @("obs", "obs-frontend-api")) {
            $exports = dumpbin /EXPORTS "obs-win/bin/64bit/$dll.dll"
            $defLines = @("LIBRARY $dll", "EXPORTS")
            foreach ($line in $exports) {
              if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $defLines += "  $($Matches[1])"
              }
            }
            $defPath = "obs-lib/$dll.def"
            $defLines | Set-Content $defPath
            lib /DEF:$defPath /OUT:"obs-lib/$dll.lib" /MACHINE:X64 | Out-Null
          }
      - name: Configure & Build Windows DLL
        shell: pwsh
        run: |
          $obsInc = (Resolve-Path "obs-inc").Path -replace '\\', '/'
          $obsLib = (Resolve-Path "obs-lib").Path -replace '\\', '/'
          cmake -B build-win -S . `
            "-DOBS_INCLUDE_DIRS=$obsInc;$obsInc/obs" `
            "-DOBS_LIB_DIRS=$obsLib" `
            "-DOBS_LIBRARIES=obs;obs-frontend-api"
          cmake --build build-win --config Release
          New-Item -ItemType Directory -Force -Path dist/obs-scripture-dock/bin/64bit | Out-Null
          $dll = Get-ChildItem -Path build-win -Filter "obs-scripture-dock.dll" -Recurse | Select-Object -First 1
          Copy-Item $dll.FullName dist/obs-scripture-dock/bin/64bit/
          Compress-Archive -Path dist/obs-scripture-dock -DestinationPath dist/obs-scripture-dock-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scripture-dock-windows-x64
          path: dist/obs-scripture-dock-windows-x64.zip
