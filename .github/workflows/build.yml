name: Build Cross-Platform (Linux / Windows / macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libobs-dev libsword-dev qt6-base-dev dpkg
      - name: Build & Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scripture-dock-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
      - name: Fetch OBS Studio 31.0.1 SDK & Headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch 31.0.1 https://github.com/obsproject/obs-studio.git obs-src
          New-Item -ItemType Directory -Force -Path obs-inc/obs | Out-Null
          Copy-Item -Path obs-src/libobs/*.h -Destination obs-inc/obs/ -Force
          Copy-Item -Path obs-src/libobs/util -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/graphics -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/callback -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/libobs/media-io -Destination obs-inc/obs/ -Recurse -Force
          Copy-Item -Path obs-src/UI/obs-frontend-api/obs-frontend-api.h -Destination obs-inc/obs/ -Force

          # Minimal obsconfig.h for plugin compilation
          @"
          #pragma once
          #define OBS_VERSION "31.0.1"
          #define HAVE_OBSCONFIG_H 1
          "@ | Set-Content obs-inc/obs/obsconfig.h

          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/31.0.1/OBS-Studio-31.0.1-Windows.zip" -OutFile obs-win.zip
          Expand-Archive -Path obs-win.zip -DestinationPath obs-win -Force
          New-Item -ItemType Directory -Force -Path obs-lib | Out-Null

          foreach ($dll in @("obs", "obs-frontend-api")) {
            $exports = dumpbin /EXPORTS "obs-win/bin/64bit/$dll.dll"
            $defLines = @("LIBRARY $dll", "EXPORTS")
            foreach ($line in $exports) {
              if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $defLines += "  $($Matches[1])"
              }
            }
            $defPath = "obs-lib/$dll.def"
            $defLines | Set-Content $defPath
            lib /DEF:$defPath /OUT:"obs-lib/$dll.lib" /MACHINE:X64 | Out-Null
          }
      - name: Build zlib & libsword (Static)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" -OutFile zlib.tar.gz
          tar -xzf zlib.tar.gz
          cmake -B zlib-build -S zlib-1.3.1 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.15" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL" `
            -DZLIB_BUILD_EXAMPLES=OFF `
            "-DCMAKE_INSTALL_PREFIX=zlib-inst"
          Select-String -Path zlib-build/zlibstatic.vcxproj -Pattern "RuntimeLibrary" | Select-Object -First 3
          cmake --build zlib-build --config Release --target zlibstatic
          New-Item -ItemType Directory -Force -Path zlib-inst/include, zlib-inst/lib | Out-Null
          Copy-Item zlib-1.3.1/zlib.h zlib-inst/include/ -Force
          Copy-Item zlib-build/zconf.h zlib-inst/include/ -Force
          Copy-Item zlib-build/Release/zlibstatic.lib zlib-inst/lib/zlib.lib -Force
          $zlibInc = (Resolve-Path "zlib-inst/include").Path -replace '\\', '/'
          $zlibLib = (Resolve-Path "zlib-inst/lib/zlib.lib").Path -replace '\\', '/'

          Invoke-WebRequest -Uri "https://crosswire.org/ftpmirror/pub/sword/source/v1.9/sword-1.9.0.tar.gz" -OutFile sword.tar.gz
          tar -xzf sword.tar.gz
          Get-Item sword-1.9.0/CMakeLists.txt, sword-1.9.0/cmake/*.cmake -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName -Raw) -replace '/MT', '/MD' -replace 'MultiThreaded(?!DLL)', 'MultiThreadedDLL' | Set-Content $_.FullName
          }
          cmake -B sword-build -S sword-1.9.0 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.15" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL" `
            "-DLIBSWORD_LIBRARY_TYPE=Static" `
            -DSWORD_BUILD_TESTS=OFF `
            -DSWORD_BUILD_EXAMPLES=OFF `
            -DSWORD_BUILD_UTILS=OFF `
            "-DZLIB_INCLUDE_DIR=$zlibInc" `
            "-DZLIB_LIBRARY=$zlibLib" `
            "-DCMAKE_INSTALL_PREFIX=sword-inst"
          (Get-Content sword-build/sword_static.vcxproj -Raw) -replace '<RuntimeLibrary>.*?</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>' | Set-Content sword-build/sword_static.vcxproj
          Select-String -Path sword-build/sword_static.vcxproj -Pattern "RuntimeLibrary" | Select-Object -First 3
          cmake --build sword-build --config Release --target sword_static
          cmake --install sword-build --config Release --component core || $true
          New-Item -ItemType Directory -Force -Path sword-inst/lib | Out-Null
          Get-ChildItem sword-build -Filter "*sword*.lib" -Recurse | Select-Object -First 1 | Copy-Item -Destination sword-inst/lib/sword.lib -Force
          Copy-Item $zlibLib sword-inst/lib/zlib.lib -Force
      - name: Configure & Build Windows DLL
        shell: pwsh
        run: |
          $obsInc = (Resolve-Path "obs-inc").Path -replace '\\', '/'
          $obsLib = (Resolve-Path "obs-lib").Path -replace '\\', '/'
          $swordInc = (Resolve-Path "sword-1.9.0/include").Path -replace '\\', '/'
          $swordLib = (Resolve-Path "sword-inst/lib/sword.lib").Path -replace '\\', '/'
          $zlibLib = (Resolve-Path "sword-inst/lib/zlib.lib").Path -replace '\\', '/'
          cmake -B build-win -S . `
            "-DOBS_INCLUDE_DIRS=$obsInc;$obsInc/obs" `
            "-DOBS_LIB_DIRS=$obsLib" `
            "-DOBS_LIBRARIES=obs;obs-frontend-api" `
            "-DSWORD_FOUND=TRUE" `
            "-DSWORD_INCLUDE_DIRS=$swordInc" `
            "-DSWORD_LIBRARIES=$swordLib;$zlibLib"
          cmake --build build-win --config Release
          New-Item -ItemType Directory -Force -Path dist/obs-scripture-dock/bin/64bit | Out-Null
          $dll = Get-ChildItem -Path build-win -Filter "obs-scripture-dock.dll" -Recurse | Select-Object -First 1
          Copy-Item $dll.FullName dist/obs-scripture-dock/bin/64bit/
          Compress-Archive -Path dist/obs-scripture-dock -DestinationPath dist/obs-scripture-dock-windows-x64.zip -Force
      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer/windows/obs-scripture-dock.iss
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scripture-dock-windows-x64
          path: |
            dist/obs-scripture-dock-windows-x64.zip
            dist/obs-scripture-dock-windows-x64-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          version: '6.8.1'
      - name: Fetch OBS Studio 31.0.1 SDK & Frameworks (Universal)
        run: |
          curl -sL https://github.com/obsproject/obs-studio/archive/refs/tags/31.0.1.tar.gz -o obs-src.tar.gz
          tar -xzf obs-src.tar.gz
          mkdir -p obs-inc/obs obs-lib
          cp -r obs-studio-31.0.1/libobs/*.h obs-inc/obs/
          cp -r obs-studio-31.0.1/libobs/util obs-inc/obs/
          cp -r obs-studio-31.0.1/libobs/graphics obs-inc/obs/
          cp -r obs-studio-31.0.1/libobs/media-io obs-inc/obs/
          cp -r obs-studio-31.0.1/libobs/callback obs-inc/obs/
          cp obs-studio-31.0.1/UI/obs-frontend-api/obs-frontend-api.h obs-inc/obs/
          cat << 'EOF' > obs-inc/obs/obsconfig.h
          #pragma once
          #define OBS_VERSION "31.0.1"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          EOF

          curl -sL https://github.com/obsproject/obs-studio/releases/download/31.0.1/OBS-Studio-31.0.1-macOS-Apple.dmg -o obs-arm64.dmg
          curl -sL https://github.com/obsproject/obs-studio/releases/download/31.0.1/OBS-Studio-31.0.1-macOS-Intel.dmg -o obs-x64.dmg
          hdiutil attach obs-arm64.dmg -nobrowse -mountpoint /Volumes/obs-arm64
          hdiutil attach obs-x64.dmg -nobrowse -mountpoint /Volumes/obs-x64

          cp -R "/Volumes/obs-arm64/OBS.app/Contents/Frameworks/libobs.framework" obs-lib/
          lipo -create \
            "/Volumes/obs-arm64/OBS.app/Contents/Frameworks/libobs.framework/Versions/A/libobs" \
            "/Volumes/obs-x64/OBS.app/Contents/Frameworks/libobs.framework/Versions/A/libobs" \
            -output "obs-lib/libobs.framework/Versions/A/libobs"

          FRONTEND_ARM=$(find "/Volumes/obs-arm64/OBS.app/Contents/Frameworks" -maxdepth 1 -name "*obs-frontend-api*.dylib" | head -n 1)
          FRONTEND_X64=$(find "/Volumes/obs-x64/OBS.app/Contents/Frameworks" -maxdepth 1 -name "*obs-frontend-api*.dylib" | head -n 1)
          FRONTEND_NAME=$(basename "$FRONTEND_ARM")
          lipo -create "$FRONTEND_ARM" "$FRONTEND_X64" -output "obs-lib/$FRONTEND_NAME"

          hdiutil detach /Volumes/obs-arm64
          hdiutil detach /Volumes/obs-x64
      - name: Build zlib & libsword (Static Universal)
        run: |
          curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib.tar.gz
          tar -xzf zlib.tar.gz
          cmake -B zlib-build -S zlib-1.3.1 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build zlib-build --target zlibstatic -j4
          mkdir -p zlib-inst/include zlib-inst/lib
          cp zlib-1.3.1/zlib.h zlib-build/zconf.h zlib-inst/include/
          cp zlib-build/libz.a zlib-inst/lib/

          curl -sL https://crosswire.org/ftpmirror/pub/sword/source/v1.9/sword-1.9.0.tar.gz -o sword.tar.gz
          tar -xzf sword.tar.gz
          cmake -B sword-build -S sword-1.9.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.15 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLIBSWORD_LIBRARY_TYPE=Static \
            -DSWORD_BUILD_TESTS=OFF \
            -DSWORD_BUILD_EXAMPLES=OFF \
            -DSWORD_BUILD_UTILS=OFF \
            -DZLIB_INCLUDE_DIR="$PWD/zlib-inst/include" \
            -DZLIB_LIBRARY="$PWD/zlib-inst/lib/libz.a"
          cmake --build sword-build --target sword_static -j4
      - name: Configure & Build macOS Universal Plugin & PKG
        run: |
          # Xcode 26 SDK removed AGL.framework referenced by Qt 6.8.1 WrapOpenGL
          find "$QT_ROOT_DIR/lib/cmake" -name "*.cmake" -exec perl -pi -e 's/-framework\s+AGL//g; s/;\s*AGL\b//g; s/\bAGL\s*;//g' {} +
          FRONTEND_LIB=$(find "$PWD/obs-lib" -maxdepth 1 -name "*obs-frontend-api*.dylib" | head -n 1)
          SWORD_LIB=$(find "$PWD/sword-build" -name "libsword.a" | head -n 1)
          cmake -B build-mac -S . \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOBS_INCLUDE_DIRS="$PWD/obs-inc;$PWD/obs-inc/obs" \
            -DOBS_LIBRARIES="$PWD/obs-lib/libobs.framework/libobs;$FRONTEND_LIB" \
            -DSWORD_FOUND=TRUE \
            -DSWORD_INCLUDE_DIRS="$PWD/sword-1.9.0/include" \
            -DSWORD_LIBRARIES="$SWORD_LIB;$PWD/zlib-inst/lib/libz.a"
          cmake --build build-mac -j4
          file build-mac/obs-scripture-dock.plugin/Contents/MacOS/obs-scripture-dock
          otool -L build-mac/obs-scripture-dock.plugin/Contents/MacOS/obs-scripture-dock
          codesign --force --deep --sign - build-mac/obs-scripture-dock.plugin

          mkdir -p dist pkg-root/Library/Application\ Support/obs-studio/plugins
          ditto -c -k --sequesterRsrc --keepParent build-mac/obs-scripture-dock.plugin dist/obs-scripture-dock-macos-universal.zip
          cp -R build-mac/obs-scripture-dock.plugin pkg-root/Library/Application\ Support/obs-studio/plugins/
          pkgbuild --root pkg-root \
            --identifier com.phdemartin.obs-scripture-dock \
            --version 1.0.0 \
            --install-location / \
            dist/obs-scripture-dock-macos-universal.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: obs-scripture-dock-macos-universal
          path: |
            dist/obs-scripture-dock-macos-universal.zip
            dist/obs-scripture-dock-macos-universal.pkg
